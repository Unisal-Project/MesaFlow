services:
  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${PRODUCTION_MARIADB_ROOT_PASSWORD:-}
      MARIADB_DATABASE: mesaflow
      MARIADB_USER: mesaflow
      MARIADB_PASSWORD: ${PRODUCTION_MARIADB_PASSWORD:-}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mesaflow_schema_v1.sql:/docker-entrypoint-initdb.d/001-mesaflow-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.production
    restart: unless-stopped
    environment:
      DATABASE_URL: ${PRODUCTION_DATABASE_URL:-}
      JWT_SECRET: ${PRODUCTION_JWT_SECRET:-}
      FRONTEND_URL: ${PRODUCTION_FRONTEND_URL:-}
      VALKEY_URL: ${PRODUCTION_VALKEY_URL:-redis://valkey:6379}
      PORT: 3333
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - product_uploads:/app/backend/uploads
    depends_on:
      database:
        condition: service_healthy
      valkey:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_PRINT_URL: ${VITE_PRINT_URL:-}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
  product_uploads:
