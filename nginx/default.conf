server {
    # O container recebe HTTP na porta 80. HTTPS depende de domínio e certificado.
    listen 80;
    # Aceita qualquer Host; o domínio definitivo ainda não foi configurado.
    server_name _;

    # Arquivos gerados pelo build do React, copiados para a imagem do Nginx.
    root /usr/share/nginx/html;
    index index.html;

    # Repassa a API ao serviço "backend" pela rede interna do Docker.
    # Sem barra final em proxy_pass: preserva /api/v1/... na URL enviada ao Fastify.
    location /api/v1/ {
        proxy_pass http://backend:3333;
        
        # Mantém a origem e o IP do cliente disponíveis para o backend e seus logs.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # As imagens enviadas pelo sistema são servidas pelo backend no mesmo domínio.
    location /uploads/ {
        proxy_pass http://backend:3333;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Entrega arquivos estáticos; rotas do React voltam ao index.html para a SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
