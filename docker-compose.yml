services:
  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  database:
    image: mariadb:11.4
    container_name: orderflow-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DEV_MARIADB_ROOT_PASSWORD:?Defina DEV_MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: orderflow
      MARIADB_USER: orderflow
      MARIADB_PASSWORD: ${DEV_MARIADB_PASSWORD:?Defina DEV_MARIADB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # O entrypoint do MariaDB executa este arquivo ao criar um volume novo.
      - ./mesaflow_schema_v1.sql:/docker-entrypoint-initdb.d/001-mesaflow-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Reaplica o schema idempotente também quando o volume já existe.
  # Assim, `docker compose up --build` não depende de apagar os dados locais.
  database-init:
    image: mariadb:11.4
    container_name: orderflow-database-init
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${DEV_MARIADB_ROOT_PASSWORD:?Defina DEV_MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: orderflow
    volumes:
      - ./mesaflow_schema_v1.sql:/schema/mesaflow_schema_v1.sql:ro,Z
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mariadb
        --host=database
        --user=root
        --password="$${MARIADB_ROOT_PASSWORD}"
        --database="$${MARIADB_DATABASE}"
        < /schema/mesaflow_schema_v1.sql

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: orderflow-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DEV_DATABASE_URL:?Defina DEV_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      VALKEY_URL: ${DEV_VALKEY_URL:-redis://valkey:6379}
      PORT: 3333
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      - "3333:3333"
    volumes:
      - product_uploads:/app/backend/uploads
    depends_on:
      database-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/backend/src
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: orderflow-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Garante que o Vite perceba alteracoes em bind mounts (Docker Desktop/WSL).
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_PRINT_URL: ${VITE_PRINT_URL:-}
    volumes:
      # Mantem o codigo local sincronizado com o servidor de desenvolvimento.
      - ./frontend:/app/frontend:z
      # Evita que o bind mount esconda as dependencias instaladas na imagem.
      - frontend_node_modules:/node_modules
    depends_on:
      - backend

volumes:
  mariadb_data:
  product_uploads:
  frontend_node_modules:
