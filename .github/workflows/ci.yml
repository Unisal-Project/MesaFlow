name: MesaFlow CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validar aplicação
    runs-on: ubuntu-24.04
    # A suíte de frontend já travou em execuções locais; sem limite o job ficaria preso.
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Compilar backend
        run: npm run build:backend

      - name: Verificar backend (tipos dos testes e formatação)
        run: npm run lint:backend

      - name: Testar backend
        # Testes de unidade/rota com fakes; os de integração com MariaDB ficam em `npm run test:db`.
        run: npm run test:backend
        timeout-minutes: 10

      - name: Verificar frontend com Oxlint
        run: npm run lint

      - name: Testar frontend
        run: npm run test:frontend
        timeout-minutes: 10

      - name: Compilar frontend
        run: npm run build:frontend

  security:
    name: Auditoria de segurança
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Auditar dependências da raiz
        run: npm audit --audit-level=moderate
