name: MesaFlow CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validar aplicação
    runs-on: ubuntu-24.04
    # A suíte de frontend já travou em execuções locais; sem limite o job ficaria preso.
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Compilar backend
        run: npm run build:backend

      - name: Verificar backend (tipos dos testes e formatação)
        run: npm run lint:backend

      - name: Testar backend
        # Testes de unidade/rota com fakes; os de integração com MariaDB ficam em `npm run test:db`.
        run: npm run test:backend
        timeout-minutes: 10

      - name: Verificar frontend com Oxlint
        run: npm run lint

      - name: Testar frontend
        run: npm run test:frontend
        timeout-minutes: 10

      - name: Compilar frontend
        run: npm run build:frontend

  integration:
    name: Testes de integração da API
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Inicializar banco de testes
        run: npm run db:test:up

      - name: Executar testes de integração
        run: npm run test:integration
        timeout-minutes: 10

      - name: Exibir logs do banco em caso de falha
        if: failure()
        run: docker compose -p mesaflow-test -f docker-compose.test.yml logs

      - name: Encerrar ambiente de testes
        if: always()
        run: npm run db:test:down

  security:
    name: Auditoria de segurança
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Produção (o que roda no servidor): qualquer vulnerabilidade moderada ou acima bloqueia.
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=moderate

      # Desenvolvimento/build (vite, sass, prisma CLI...): bloqueia só as críticas; as demais
      # ficam no relatório. Ex.: picomatch <=4.0.7 (GHSA-fc5q-39xc-vjpf) ainda sem versão
      # corrigida, usado só no build com padrões do próprio projeto.
      - name: Auditar dependências de desenvolvimento
        run: npm audit --audit-level=critical
